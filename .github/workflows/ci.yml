name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://erptaller_ci:erptaller_ci@localhost:5432/erptaller_ci
      TEST_DATABASE_URL: postgresql+psycopg://erptaller_ci:erptaller_ci@localhost:5432/erptaller_ci
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: erptaller_ci
          POSTGRES_USER: erptaller_ci
          POSTGRES_PASSWORD: erptaller_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erptaller_ci -d erptaller_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv run python ../../scripts/check_backend_architecture.py
      - run: uv run alembic heads
      - run: uv run alembic upgrade head
      - run: uv run alembic current

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm architecture:check
      - run: pnpm build

  containers:
    name: Container validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config
      - run: docker compose build
